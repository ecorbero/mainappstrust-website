<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Main Apps Trust">
  <!-- concentric rings -->
  <circle cx="256" cy="256" r="178" stroke="currentColor" stroke-width="24"/>
  <circle cx="256" cy="256" r="145" stroke="currentColor" stroke-width="24"/>

  <!-- four lobes with pierced centres -->
  <g fill="currentColor">
    <g transform="translate(256 34)">
      <path fill-rule="evenodd" d="M0 0a25 25 0 1 0 0 44a25 25 0 1 0 0-44Zm0 14a11 11 0 1 1 0 22a11 11 0 1 1 0-22Z"/>
    </g>
    <g transform="translate(256 478) rotate(180)">
      <path fill-rule="evenodd" d="M0 0a25 25 0 1 0 0 44a25 25 0 1 0 0-44Zm0 14a11 11 0 1 1 0 22a11 11 0 1 1 0-22Z"/>
    </g>
    <g transform="translate(34 256) rotate(-90)">
      <path fill-rule="evenodd" d="M0 0a25 25 0 1 0 0 44a25 25 0 1 0 0-44Zm0 14a11 11 0 1 1 0 22a11 11 0 1 1 0-22Z"/>
    </g>
    <g transform="translate(478 256) rotate(90)">
      <path fill-rule="evenodd" d="M0 0a25 25 0 1 0 0 44a25 25 0 1 0 0-44Zm0 14a11 11 0 1 1 0 22a11 11 0 1 1 0-22Z"/>
    </g>
  </g>

  <!-- eight orange studs -->
  <g fill="#fc6200">
    <circle cx="256" cy="141" r="14"/>
    <circle cx="337" cy="175" r="14"/>
    <circle cx="371" cy="256" r="14"/>
    <circle cx="337" cy="337" r="14"/>
    <circle cx="256" cy="371" r="14"/>
    <circle cx="175" cy="337" r="14"/>
    <circle cx="141" cy="256" r="14"/>
    <circle cx="175" cy="175" r="14"/>
  </g>

  <!-- orange diamond, pierced -->
  <path fill="#fc6200" fill-rule="evenodd"
        d="M256 166 L346 256 L256 346 L166 256 Z
           M256 210.5 L301.5 256 L256 301.5 L210.5 256 Z"/>

  <!-- centre stud -->
  <path fill="currentColor" d="M256 236 L276 256 L256 276 L236 256 Z"/>
</svg>
